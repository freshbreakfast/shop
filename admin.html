<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鮮到味｜後台管理系統</title>

<style>
body{
    font-family: Arial;
    background:#f5f5f5;
    padding:20px;
}

h2{
    text-align:center;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:10px;
    overflow:hidden;
}

th, td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:center;
}

th{
    background:#111;
    color:white;
}

button{
    padding:6px 12px;
    margin:2px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.allow{
    background:#4CAF50;
    color:white;
}

.block{
    background:#f44336;
    color:white;
}

.refresh{
    background:#333;
    color:white;
    margin-bottom:10px;
}
</style>
</head>

<body>

<h2>📊 鮮到味｜客戶管理後台</h2>

<button class="refresh" onclick="loadData()">🔄 重新整理</button>

<table>
    <thead>
        <tr>
            <th>客戶名稱</th>
            <th>LINE ID</th>
            <th>狀態</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody id="list"></tbody>
</table>

<script>

const API_URL = "你的Apps Script網址";

// ======================
// 📥 讀取資料
// ======================
async function loadData(){

    const res = await fetch(API_URL, {
        method:"POST",
        headers:{
            "Content-Type":"application/x-www-form-urlencoded"
        },
        body:"action=list"
    });

    const data = await res.json();

    const list = document.getElementById("list");
    list.innerHTML = "";

    data.forEach(item => {

        list.innerHTML += `
        <tr>
            <td>${item.name}</td>
            <td>${item.userId}</td>
            <td>${item.status}</td>
            <td>
                <button class="allow" onclick="updateStatus('${item.userId}','allow')">允許</button>
                <button class="block" onclick="updateStatus('${item.userId}','block')">拒絕</button>
            </td>
        </tr>
        `;
    });

}

// ======================
// ✏️ 更新狀態
// ======================
function updateStatus(userId, status){

    fetch(API_URL, {
        method:"POST",
        headers:{
            "Content-Type":"application/x-www-form-urlencoded"
        },
        body:`action=update&userId=${userId}&status=${status}`
    })
    .then(() => {
        loadData();
    });

}

// 初始化
loadData();

</script>

</body>
</html>
