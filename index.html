<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>專屬報價系統</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f5f5f5;
  text-align:center;
}

.container{
  padding:60px 20px;
}

input{
  padding:12px;
  width:80%;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:16px;
}

button{
  margin-top:15px;
  padding:12px;
  width:80%;
  border:none;
  border-radius:10px;
  background:#333;
  color:#fff;
  font-size:16px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:15px;
  margin-top:20px;
}

.version{
  display:inline-block;
  padding:5px 10px;
  border-radius:8px;
  background:#eee;
  margin-top:10px;
  font-size:14px;
}

.lock{
  color:red;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container" id="loginBox">
  <h2>🔒 專屬報價登入</h2>
  <input type="password" id="pwd" placeholder="輸入報價密碼">
  <button onclick="checkPwd()">進入報價</button>
</div>

<div id="content"></div>

<script>

// 🔐 報價資料（你可以自己改）
const quotes = {
  "ABC123": {
    customer: "永和早餐店",
    version: "V2",
    pdf: "報價單.pdf"
  },
  "XYZ789": {
    customer: "板橋早午餐",
    version: "V1",
    pdf: "報價單.pdf"
  }
};

// 👉 主邏輯
function checkPwd(){

  const input = document.getElementById("pwd").value;

  if(!quotes[input]){
    alert("❌ 密碼錯誤");
    return;
  }

  const key = "quote_" + input;

  // 🔥 看過就鎖
  if(localStorage.getItem(key)){
    lockPage();
    return;
  }

  // 第一次進入
  localStorage.setItem(key, "used");

  showQuote(input);
}

// 📄 顯示報價
function showQuote(code){

  const data = quotes[code];

  document.getElementById("loginBox").style.display = "none";

  document.getElementById("content").innerHTML = `
    <div class="card">
      <h2>📄 ${data.customer}｜專屬報價</h2>

      <div class="version">版本 ${data.version}</div>

      <p>✔ 已成功進入報價</p>
      <p>⚠ 此報價僅限一次查看</p>

      <button onclick="openPDF('${data.pdf}')">📄 開啟 PDF</button>
    </div>
  `;
}

// ❌ 鎖定畫面
function lockPage(){
  document.getElementById("loginBox").style.display = "none";

  document.getElementById("content").innerHTML = `
    <div class="card">
      <h2 class="lock">❌ 此報價已查看</h2>
      <p>如需再次查看請聯絡業務</p>
    </div>
  `;
}

// 📄 PDF
function openPDF(file){
  window.open(file, "_blank");
}

</script>

</body>
</html>
