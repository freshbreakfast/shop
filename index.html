<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鮮到味｜專屬報價</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
body{
    font-family: Arial;
    text-align:center;
    padding:40px;
    background:#f5f5f5;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.version{
    margin:10px 0;
    font-size:18px;
    color:#444;
}

button{
    width:100%;
    padding:12px;
    background:black;
    color:white;
    border:none;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="card">
    <h2 id="name">載入中...</h2>
    <div class="version" id="version">---</div>

    <button onclick="openPDF()">查看報價單</button>
</div>

<script>

const API_URL = "你的AppsScript網址";
const LIFF_ID = "你的LIFF ID";
const PDF_URL = "quotation.pdf";

async function main(){

    await liff.init({ liffId: LIFF_ID });

    if(!liff.isLoggedIn()){
        liff.login();
        return;
    }

    const profile = await liff.getProfile();

    const userId = profile.userId;
    const name = profile.displayName;

    document.getElementById("name").innerText = "歡迎 " + name;

    fetch(API_URL, {
        method:"POST",
        headers:{
            "Content-Type":"application/x-www-form-urlencoded"
        },
        body:`userId=${userId}&name=${name}`
    })
    .then(res => res.json())
    .then(data => {

        document.getElementById("version").innerText =
            "📄 專屬報價：" + data.version;

    });

}

function openPDF(){
    window.open(PDF_URL, "_blank");
}

main();

</script>

</body>
</html>
