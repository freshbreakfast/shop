<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鮮到味｜專屬報價</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f5f5f5;
}

/* 登入 */
.login{
  text-align:center;
  padding:60px 20px;
}

input{
  padding:12px;
  width:80%;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:16px;
}

button{
  margin-top:15px;
  padding:12px;
  width:80%;
  border:none;
  border-radius:10px;
  background:#333;
  color:#fff;
  font-size:16px;
}

.line-btn{
  margin-top:15px;
  padding:12px;
  width:80%;
  border:none;
  border-radius:10px;
  background:#06C755;
  color:#fff;
  font-size:16px;
}

.hint{
  margin-top:10px;
  color:#666;
  font-size:14px;
}

/* 內容 */
#content{
  display:none;
  padding:20px;
}

.card{
  background:#fff;
  padding:15px;
  border-radius:15px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<div class="login">
  <h2 id="title">🔒 請輸入密碼查看報價</h2>

  <div class="hint" id="hint"></div>

  <input type="password" id="pwd" placeholder="輸入密碼">
  <button onclick="check()">進入</button>

  <!-- 👉 LINE 按鈕 -->
  <button class="line-btn" id="lineBtn" style="display:none;" onclick="openLine()">
    📞 聯絡客服 LINE
  </button>
</div>

<div id="content">
  <h2>📄 報價單</h2>

  <div class="card">非基改豆漿 $80</div>
  <div class="card">手作水餃 $120</div>
</div>

<script>

// 👉 你的 LINE ID
const lineID = "567ncwhd";

// 👉 密碼
const currentPassword = "ABC123";

// 👉 是否看過
const viewed = localStorage.getItem("viewed");

if(!viewed){
  document.getElementById("hint").innerText =
    "👉 本次密碼：" + currentPassword;
}else{
  document.getElementById("title").innerText =
    "❌ 此報價已查看";

  document.getElementById("hint").innerText =
    "📞 請聯絡客服取得新密碼";

  // 👉 顯示 LINE 按鈕
  document.getElementById("lineBtn").style.display = "block";
}

// 👉 LINE 開啟
function openLine(){
  const text = encodeURIComponent("我要重新查看報價，請提供新密碼");
  window.open(`https://line.me/R/ti/p/@${lineID}?text=${text}`, "_blank");
}

// 👉 驗證
function check(){
  const input = document.getElementById("pwd").value;

  if(input === currentPassword){

    document.querySelector(".login").style.display="none";
    document.getElementById("content").style.display="block";

    localStorage.setItem("viewed", true);

  }else{
    alert("密碼錯誤");
  }
}

</script>

</body>
</html>
