<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>報價系統</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f5f5f5;
  text-align:center;
}

.container{
  padding:60px 20px;
}

input{
  padding:12px;
  width:80%;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:16px;
}

button{
  margin-top:15px;
  padding:12px;
  width:80%;
  border:none;
  border-radius:10px;
  background:#333;
  color:#fff;
  font-size:16px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:15px;
  margin-top:20px;
}

.lock{
  color:red;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container" id="loginBox">
  <h2>🔒 請輸入報價密碼</h2>
  <input type="password" id="pwd" placeholder="輸入密碼">
  <button onclick="checkPwd()">進入</button>
</div>

<div id="content"></div>

<script>

// 🔐 可用密碼（你可自行加）
const validPasswords = ["ABC123","XYZ789","NEW888"];

// 👉 主程式
function checkPwd(){

  const input = document.getElementById("pwd").value;

  // ❌ 密碼錯誤
  if(!validPasswords.includes(input)){
    alert("❌ 密碼錯誤");
    return;
  }

  const key = "quote_" + input;

  // 🔥 已看過就鎖
  if(localStorage.getItem(key)){
    lockPage();
    return;
  }

  // ✅ 第一次進入
  localStorage.setItem(key, "used");

  showQuote(input);
}

// 📄 顯示報價
function showQuote(code){

  document.getElementById("loginBox").style.display = "none";

  document.getElementById("content").innerHTML = `
    <div class="card">
      <h2>📄 報價單</h2>
      <p>報價代碼：${code}</p>
      <p>✔ 已成功進入報價</p>

      <button onclick="openPDF()">📄 開啟 PDF</button>
    </div>
  `;
}

// ❌ 鎖定畫面
function lockPage(){
  document.getElementById("loginBox").style.display = "none";

  document.getElementById("content").innerHTML = `
    <div class="card">
      <h2 class="lock">❌ 此報價已查看</h2>
      <p>如需再次查看請聯絡業務</p>
    </div>
  `;
}

// 📄 PDF
function openPDF(){
  window.open("報價單.pdf","_blank");
}

</script>
</body>
</html>
