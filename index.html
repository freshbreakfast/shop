<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>報價單</title>

<style>
body{
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f5f5f5;
}
.card{
    background:white;
    padding:30px;
    border-radius:12px;
    width:320px;
    text-align:center;
}
button{
    width:100%;
    padding:10px;
    background:black;
    color:white;
    border:none;
}
.version{
    margin-bottom:10px;
    color:#666;
}
</style>
</head>

<body>

<div class="card">
    <h2>輸入密碼</h2>
    <input id="pwd" type="password">
    <button onclick="login()">進入</button>

    <div class="version" id="versionText"></div>

    <button onclick="download()" style="margin-top:10px;">下載報價單</button>
</div>

<script>

const API_URL = "你的AppsScript網址";
const PDF_URL = "quotation.pdf";

let userPwd = "";

function login(){

    userPwd = document.getElementById("pwd").value;

    fetch(API_URL, {
        method:"POST",
        headers:{
            "Content-Type":"application/x-www-form-urlencoded"
        },
        body:`pwd=${userPwd}`
    })
    .then(res => res.json())
    .then(data => {

        document.getElementById("versionText").innerText =
            "本次報價版本：" + data.version;

    });
}

function download(){
    window.open(PDF_URL, "_blank");
}

</script>

</body>
</html>
