<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>系統</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    input, button { padding: 8px; margin: 5px; }
  </style>
</head>
<body>

<!-- ================= 版本顯示 ================= -->
<p>目前版本：<span id="versionBox"></span></p>

<!-- ================= 密碼輸入 ================= -->
<h3>輸入密碼</h3>
<input type="password" id="passwordInput" placeholder="請輸入密碼" />
<button onclick="checkPassword()">進入</button>

<p id="status"></p>

<script>
/* =========================
   版本系統（LocalStorage）
========================= */
let visitCount = localStorage.getItem("visit_count");

if (!visitCount) {
  visitCount = 1;
} else {
  visitCount = parseInt(visitCount) + 1;
}

localStorage.setItem("visit_count", visitCount);

document.getElementById("versionBox").innerText = `第${visitCount}版`;

/* =========================
   密碼驗證
========================= */
function checkPassword() {
  const input = document.getElementById("passwordInput").value;

  const correctPassword = "1234"; // ← 可自行修改

  if (input === correctPassword) {
    document.getElementById("status").innerText = "✅ 進入成功";
  } else {
    document.getElementById("status").innerText = "❌ 密碼錯誤";
  }
}
</script>

</body>
</html>
